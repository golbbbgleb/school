<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Вірш Т.Г. Шевченка</title>
  <style>
    /* Налаштування фону та вирівнювання всієї сторінки */
    body {
      background-color: #eef2f5; /* Світлий колір фону */
      text-align: center;         /* Вирівнювання елементів по центру */
      padding: 20px;
    }

    /* Заголовок першого рівня */
    h1 {
      color: #1a365d;
      font-size: 32px;
    }

    /* Заголовок третього рівня */
    h3 {
      color: #4a5568;
      font-size: 22px;
      margin-bottom: 30px;
    }

    /* Блок з віршем */
    .poem {
      font-size: 24px;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    /* Різні шрифти та кольори для кожного рядка */
    .line1 {
      font-family: "Times New Roman", serif;
      color: #c53030;
    }
    .line2 {
      font-family: Arial, sans-serif;
      color: #2f855a;
    }
    .line3 {
      font-family: "Courier New", monospace;
      color: #6b46c1;
    }
    .line4 {
      font-family: Georgia, serif;
      color: #d69e2e;
    }

    /* Оформлення зображення та рамки */
    img {
      width: 450px;
      max-width: 90%;
      border: 5px solid #2b6cb0; /* Рамка навколо зображення */
      border-radius: 12px;        /* Закруглені кути */
      padding: 5px;
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <h1>На вічну пам'ять Котляревському</h1>
  <h3>Т. Г. Шевченко</h3>

  <div class="poem">
    <div class="line1">Сонце гріє, вітер віє</div>
    <div class="line2">З поля на долину,</div>
    <div class="line3">Над водою гне з вербою</div>
    <div class="line4">Червону калину.</div>
  </div>

  <!-- Ілюстрація до вірша -->
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Viburnum_opulus_2015_G1.jpg/800px-Viburnum_opulus_2015_G1.jpg" alt="Червона калина">

</body>
</html>
